apiVersion: v1
kind: Namespace
metadata:
  name: devops-production
  labels:
    environment: production
    app: enterprise-platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: devops-production
data:
  PORT: "8080"
  NODE_ENV: "production"
  RELEASE_TRACK: "stable"
  APP_VERSION: "1.0.0"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: devops-production
type: Opaque
stringData:
  MONGO_URI: "mongodb://admin:password123@mongodb-service:27017/production?authSource=admin"
  JWT_SECRET: "eX9_super_secure_enterprise_jwt_token_2026"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-api-stable
  namespace: devops-production
  labels:
    app: enterprise-api
    track: stable
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: enterprise-api
      track: stable
  template:
    metadata:
      labels:
        app: enterprise-api
        track: stable
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: devops-enterprise-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-api-service
  namespace: devops-production
  labels:
    app: enterprise-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
      name: http
  selector:
    app: enterprise-api
    track: stable
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: enterprise-api-hpa
  namespace: devops-production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: enterprise-api-stable
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
