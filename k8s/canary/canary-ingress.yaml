# ==========================================================
# ADVANCED DEPLOYMENT STRATEGY: CANARY RELEASES VIA NGINX
# 90% Production Traffic -> Stable Version (v1.0.0)
# 10% Production Traffic -> Canary Version (v2.0.0-rc)
# ==========================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-api-canary
  namespace: devops-production
  labels:
    app: enterprise-api
    track: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enterprise-api
      track: canary
  template:
    metadata:
      labels:
        app: enterprise-api
        track: canary
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: devops-enterprise-api:2.0.0-canary
          ports:
            - containerPort: 8080
          env:
            - name: RELEASE_TRACK
              value: "canary"
            - name: APP_VERSION
              value: "2.0.0-rc"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-api-canary-service
  namespace: devops-production
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: enterprise-api
    track: canary
---
# Main Ingress (Receives 100% normal traffic)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enterprise-api-ingress-primary
  namespace: devops-production
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - host: api.enterprise-devops.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: enterprise-api-service
                port:
                  number: 80
---
# Canary Ingress (Splits 10% traffic to Canary pods)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enterprise-api-ingress-canary
  namespace: devops-production
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "10"
spec:
  rules:
    - host: api.enterprise-devops.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: enterprise-api-canary-service
                port:
                  number: 80
