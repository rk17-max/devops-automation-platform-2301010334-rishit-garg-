version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-enterprise-api:latest
    container_name: devops-enterprise-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - RELEASE_TRACK=stable
      - APP_VERSION=1.0.0
    depends_on:
      - mongodb
    networks:
      - devops-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

  mongodb:
    image: mongo:7.0
    container_name: devops-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    volumes:
      - mongo_data:/data/db
    networks:
      - devops-network

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: devops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - devops-network

  grafana:
    image: grafana/grafana:10.4.2
    container_name: devops-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - devops-network

networks:
  devops-network:
    driver: bridge

volumes:
  mongo_data:
